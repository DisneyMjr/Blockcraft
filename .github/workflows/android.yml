name: Gerar APK Blockcraft
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Instalar Godot e templates
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update && sudo apt-get install -y unzip wget
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      - name: Conferir scripts e importar recursos
        run: godot --headless --editor --path . --quit
      - name: Gerar APK de debug
        run: |
          mkdir -p build
          godot --headless --path . --export-debug Android build/Blockcraft-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Blockcraft-Android-APK
          path: build/Blockcraft-debug.apk
          if-no-files-found: error
