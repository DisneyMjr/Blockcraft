
name: Publicar Blockcraft Web

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Godot
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/4.4.1.stable ~/.local/share/godot/export_templates/

      - name: Importar recursos do jogo
        run: |
          godot --headless --path . --editor --import

      - name: Exportar jogo para navegador
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html
          test -n "$(find build/web -name '*.wasm' -print -quit)"
          touch build/web/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos da versao Web
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Publicar jogo
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
