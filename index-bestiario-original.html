<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blockcraft | Bestiário 3D</title><style>
*{box-sizing:border-box}body{margin:0;background:#081423;color:#e8f4f2;font:15px Arial,sans-serif}header{padding:17px 22px;border-bottom:1px solid #294052;display:flex;justify-content:space-between;gap:15px;align-items:center}header b{color:#ffd05c;font-size:23px}main{display:grid;grid-template-columns:310px minmax(0,1fr);height:calc(100vh - 70px)}aside{overflow:auto;border-right:1px solid #294052;padding:20px}aside p{color:#9db4c4;font-size:13px;line-height:1.5}input,select{background:#12253a;color:white;border:1px solid #4c6577;border-radius:8px;padding:11px;width:100%;margin:7px 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.mob{padding:11px 6px;background:#1b3142;color:#fff;border:1px solid #34536a;border-radius:8px;cursor:pointer;text-align:center;font-size:12px}.mob.active{border-color:#ffd05c;color:#ffd05c;background:#2e3643}.mob small{display:block;color:#8ba6b7;margin-top:4px}section{position:relative;min-width:0}canvas{display:block}.info{position:absolute;top:17px;left:18px;background:#0c1928d9;padding:16px;border:1px solid #436070;border-radius:12px;min-width:210px}.info strong{font-size:20px;color:#ffcf56}.info p{margin:6px 0;color:#b4cfdd}.footer{position:absolute;bottom:15px;left:16px;color:#c6d5d8;font-size:12px;background:#102439c9;padding:9px;border-radius:7px}@media(max-width:700px){main{display:flex;flex-direction:column-reverse;height:auto}aside{height:42vh}section{height:51vh}header b{font-size:19px}}
</style></head><body><header><b>BLOCKCRAFT <span style="color:#fff;font-size:14px">BESTIÁRIO 3D</span></b><span>32 criaturas • modelos voxel animados</span></header><main><aside><input id="busca" placeholder="Buscar criatura..."><select id="filtro"><option value="todos">Todas as criaturas</option><option value="passivo">Passivas</option><option value="neutro">Neutras</option><option value="hostil">Hostis</option><option value="chefe">Chefes</option></select><div class="grid" id="lista"></div><p>Prévia interativa. Clique em uma criatura, arraste para girar e use o scroll para aproximar. Os modelos e as animações estão no arquivo <b>criaturas.js</b>.</p></aside><section id="palco"><div class="info"><strong id="nome">Zumbi</strong><p id="tipo">Hostil</p><span id="numero"></span></div><div class="footer">Mouse: girar e aproximar • Animação 3D em tempo real</div></section></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.147.0/three.min.js" onerror="window.THREE_FALHOU=true"></script>
<script src="./criaturas.js"></script>
<script>
(function(){
const palco=document.getElementById('palco');
const aviso=document.createElement('div');aviso.style.cssText='display:none;position:absolute;z-index:10;top:90px;left:18px;right:18px;padding:18px;background:#422420;color:white;border:1px solid #ffb980;border-radius:12px;line-height:1.6';palco.appendChild(aviso);
function falha(m){aviso.style.display='block';aviso.innerHTML='<b>Não foi possível abrir o 3D.</b><p>'+m+'</p>';}
if(!window.THREE){falha('A biblioteca Three.js não carregou. Confirme a conexão com a internet e recarregue a página. Se estiver offline, use um servidor ou salve a biblioteca localmente.');return;}
if(!window.BlockcraftCriaturas){falha('O arquivo criaturas.js não foi encontrado. Mantenha index.html e criaturas.js na mesma pasta.');return;}
try{
const {BESTIARIO,criarCriatura}=window.BlockcraftCriaturas;
const scene=new THREE.Scene();scene.background=new THREE.Color('#8cbee8');scene.fog=new THREE.Fog('#8cbee8',17,32);
const camera=new THREE.PerspectiveCamera(50,1,.1,100);camera.position.set(4,3.2,5.4);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;palco.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight('#ffffff','#5a765e',2));const sun=new THREE.DirectionalLight('#fff2d9',2.2);sun.position.set(4,9,7);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const ground=new THREE.Mesh(new THREE.BoxGeometry(200,.5,200),new THREE.MeshStandardMaterial({color:'#6b9952',roughness:1}));ground.position.y=-.27;ground.receiveShadow=true;scene.add(ground);
const grass=new THREE.GridHelper(200,100,'#7cad5c','#7cad5c');grass.position.y=.006;scene.add(grass);
let distance=7,polar=1.13,azimuth=.68,targetY=1;
function positionCamera(){camera.position.set(distance*Math.sin(polar)*Math.sin(azimuth),targetY+distance*Math.cos(polar),distance*Math.sin(polar)*Math.cos(azimuth));camera.lookAt(0,targetY,0)}positionCamera();
let dragging=false,lastX=0,lastY=0;const canvas=renderer.domElement;canvas.style.cursor='grab';canvas.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointerup',()=>dragging=false);canvas.addEventListener('pointermove',e=>{if(!dragging)return;azimuth-=(e.clientX-lastX)*.008;polar=Math.max(.2,Math.min(1.54,polar+(e.clientY-lastY)*.007));lastX=e.clientX;lastY=e.clientY;positionCamera()});canvas.addEventListener('wheel',e=>{e.preventDefault();distance=Math.max(2.2,Math.min(14,distance+e.deltaY*.008));positionCamera()},{passive:false});
let current=null,active='zumbi';function escolher(id){active=id;if(current)scene.remove(current);current=criarCriatura(id);scene.add(current);const mob=BESTIARIO.find(x=>x.id===id);document.getElementById('nome').textContent=mob.nome;document.getElementById('tipo').textContent=mob.tipo.toUpperCase();document.getElementById('numero').textContent=`Criatura ${BESTIARIO.indexOf(mob)+1} de ${BESTIARIO.length}`;document.querySelectorAll('.mob').forEach(b=>b.classList.toggle('active',b.dataset.id===id));targetY=id==='dragao'?1.35:1;distance=id==='dragao'?10:7;positionCamera()}
function listar(){const q=document.getElementById('busca').value.toLowerCase(),f=document.getElementById('filtro').value;const container=document.getElementById('lista');container.replaceChildren();BESTIARIO.filter(m=>m.nome.toLowerCase().includes(q)&&(f==='todos'||m.tipo===f)).forEach(m=>{const b=document.createElement('button');b.className='mob'+(m.id===active?' active':'');b.dataset.id=m.id;b.textContent=m.nome;const small=document.createElement('small');small.textContent=m.tipo;b.appendChild(small);b.onclick=()=>escolher(m.id);container.appendChild(b)})}
document.getElementById('busca').addEventListener('input',listar);document.getElementById('filtro').addEventListener('change',listar);
function resize(){const w=palco.clientWidth,h=palco.clientHeight;if(!w||!h)return;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}window.addEventListener('resize',resize);resize();listar();escolher('zumbi');
const clock=new THREE.Clock();let elapsed=0;function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.08);elapsed+=dt;if(current?.userData.update)current.userData.update(dt,elapsed);renderer.render(scene,camera)}tick();
}catch(e){console.error(e);falha('Erro: '+String(e.message||e)+'. Pressione F12 para ver os detalhes no Console.');}
})();
</script></body></html>
